[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    unit: standalone module tests (Phase 1)
    noc: network tests (Phase 2-3)
    protocol: directed coherence tests (Phase 6-9)
    race: the twelve-race catalogue (Phase 10)
    stress: constrained-random stress (Phase 11)
