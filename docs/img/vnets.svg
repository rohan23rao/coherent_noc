<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" role="img" aria-label="Three virtual networks — the message dependency graph"><defs><marker id="a1b2733" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1b2733"/></marker><marker id="a5a9e68" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5a9e68"/></marker></defs><rect width="1240" height="900" fill="#ffffff"/><text x="24" y="30" font-family="system-ui, sans-serif" font-size="16" font-weight="650" fill="#1b2733">Three virtual networks — the message dependency graph</text><text x="24" y="50" font-family="system-ui, sans-serif" font-size="11.5" fill="#5b6b7c">A request may cause a forward. A forward may cause a response. A response causes nothing. Three levels of dependency, three virtual networks.</text><rect x="60" y="120" width="640" height="110" rx="10" fill="#ffffff" stroke="#c2565c" stroke-width="2.0"/><rect x="60" y="120" width="9" height="110" rx="4" fill="#c2565c" stroke="#c2565c" stroke-width="1.4"/><text x="90" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="start" fill="#c2565c">VN0   request</text><text x="680" y="150" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="end" fill="#5b6b7c">L1 -&gt; directory,  directory -&gt; memory</text><text x="90" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#1b2733">GetS   GetM   PutS   PutM   PutE</text><text x="90" y="204" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#c2565c">MAY STALL, for as long as it likes</text><rect x="60" y="268" width="640" height="110" rx="10" fill="#ffffff" stroke="#d9a441" stroke-width="2.0"/><rect x="60" y="268" width="9" height="110" rx="4" fill="#d9a441" stroke="#d9a441" stroke-width="1.4"/><text x="90" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="start" fill="#d9a441">VN1   forward</text><text x="680" y="298" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="end" fill="#5b6b7c">directory -&gt; L1</text><text x="90" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#1b2733">Fwd-GetS   Fwd-GetM   Inv   Put-Ack   Recall   Recall-Inv</text><text x="90" y="352" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#d9a441">may stall only on a transient state, and only briefly</text><rect x="60" y="416" width="640" height="110" rx="10" fill="#ffffff" stroke="#3f7fb5" stroke-width="2.0"/><rect x="60" y="416" width="9" height="110" rx="4" fill="#3f7fb5" stroke="#3f7fb5" stroke-width="1.4"/><text x="90" y="446" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="start" fill="#3f7fb5">VN2   response</text><text x="680" y="446" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="end" fill="#5b6b7c">L1 -&gt; L1,  L1 -&gt; directory,  directory -&gt; L1,  memory -&gt; directory</text><text x="90" y="474" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#1b2733">Data   Data-E   Inv-Ack   WB-Data   Recall-Ack</text><text x="90" y="500" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#3f7fb5">MUST NEVER STALL — this is the sink</text><path d="M 380,230 L 380,268" fill="none" stroke="#1b2733" stroke-width="2.4" marker-end="url(#a1b2733)"/><text x="396" y="254" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1b2733">may cause</text><path d="M 380,378 L 380,416" fill="none" stroke="#1b2733" stroke-width="2.4" marker-end="url(#a1b2733)"/><text x="396" y="402" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1b2733">may cause</text><path d="M 380,526 L 380,560" fill="none" stroke="#5a9e68" stroke-width="2.4" marker-end="url(#a5a9e68)"/><text x="396" y="552" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" text-anchor="start" fill="#5a9e68">causes nothing — the chain terminates</text><text x="380" y="592" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="650" text-anchor="middle" fill="#1b2733">a strict partial order, so with one buffer pool per class no cycle can form</text><rect x="740" y="120" width="440" height="226" rx="10" fill="#eef4fa" stroke="#3f7fb5" stroke-width="1.8"/><text x="764" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" text-anchor="start" fill="#1f5a86">The sink requirement</text><text x="764" y="170" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">The argument holds only if the last level is a TRUE sink:</text><text x="764" y="184" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">a VN2 message must always be accepted by its destination</text><text x="764" y="198" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">in bounded time, without the destination needing to send</text><text x="764" y="212" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">anything first.</text><text x="764" y="226" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c"></text><text x="764" y="240" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">It is met by construction, not by hope. The MSHR or TBE</text><text x="764" y="254" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">that will consume a response is allocated BEFORE the</text><text x="764" y="268" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">request that produces it is sent, so the buffer space is</text><text x="764" y="282" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">already reserved. An L1's vn2_ready_o is therefore tied</text><text x="764" y="296" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">high, and the directory's VN2 input is a queue whose</text><text x="764" y="310" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">fullness is asserted never to occur.</text><rect x="740" y="366" width="440" height="226" rx="10" fill="#ffffff" stroke="#b9c6d3" stroke-width="1.4"/><text x="764" y="394" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" text-anchor="start" fill="#1b2733">Where each edge is guarded</text><text x="764" y="418" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#5b6b7c">VN2 must be accepted</text><text x="1156" y="418" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="end" fill="#1b2733">a_vn2_never_backs_up</text><text x="764" y="439" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#5b6b7c">VN2 always has a home</text><text x="1156" y="439" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="end" fill="#1b2733">a_vn2_always_lands</text><text x="764" y="460" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#5b6b7c">VN0 may stall, not forever</text><text x="1156" y="460" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="end" fill="#1b2733">a_tbe_liveness</text><text x="764" y="481" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#5b6b7c">a packet keeps its vnet</text><text x="1156" y="481" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="end" fill="#1b2733">a_vnet_assignment</text><text x="764" y="502" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#5b6b7c">a VC carries one vnet</text><text x="1156" y="502" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="end" fill="#1b2733">a_same_vnet</text><text x="764" y="523" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#5b6b7c">a packet keeps its VC</text><text x="1156" y="523" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="end" fill="#1b2733">a_same_vc</text><text x="764" y="544" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#5b6b7c">credits are never lost</text><text x="1156" y="544" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="end" fill="#1b2733">a_tail_credit_not_lost</text><text x="764" y="565" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#5b6b7c">an event is legal in its state</text><text x="1156" y="565" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="end" fill="#1b2733">a_no_illegal_event</text><rect x="60" y="626" width="1120" height="190" rx="10" fill="#fdf6f6" stroke="#c2565c" stroke-width="1.4"/><text x="84" y="654" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="700" text-anchor="start" fill="#8d3b40">Three separate queues are not three separate networks</text><text x="84" y="676" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">...if anything downstream arbitrates between them without knowing why they are separate. Three Phase-8 bugs were all that same mistake, and each one deadlocked:</text><text x="84" y="710" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" text-anchor="start" fill="#8d3b40">B11</text><text x="128" y="710" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1b2733">the NIC ejected one message per cycle across all VCs, lowest index first. A stalled VN0 slot permanently outranked the VN1 and VN2 slots behind it.</text><text x="84" y="738" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" text-anchor="start" fill="#8d3b40">B14</text><text x="128" y="738" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1b2733">the VC allocator picked one VC per input port BEFORE checking output availability, so a blocked VN0 VC won every cycle and never advanced the round-robin pointer.</text><text x="84" y="766" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" text-anchor="start" fill="#8d3b40">B10</text><text x="128" y="766" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1b2733">the NIC gave its L1 strict priority over its directory on VN2, starving one response source.</text><text x="84" y="800" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#8d3b40">Every one of them passed the direct-connect tests, where the shared resource was never contended.</text><text x="60" y="852" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">Two VCs per vnet are NOT part of this argument. They are head-of-line-blocking relief; deleting one would cost throughput and nothing else.</text><text x="60" y="866" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">What they ARE part of is ordering — see the next diagram.</text></svg>
