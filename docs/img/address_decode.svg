<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-label="Address decode, and the tag that is not contiguous"><rect width="980" height="500" fill="#ffffff"/><text x="24" y="30" font-family="system-ui, sans-serif" font-size="16" font-weight="650" fill="#1b2733">Address decode, and the tag that is not contiguous</text><text x="24" y="50" font-family="system-ui, sans-serif" font-size="11.5" fill="#5b6b7c">The home-bank bits sit BELOW the index field. That is the whole reason the L1 tag has a hole in it.</text><rect x="176" y="104" width="285.75" height="54" rx="4" fill="#ffffff" stroke="#8fa0b0" stroke-width="1.4"/><text x="318.875" y="132.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1b2733">upper tag</text><text x="318.875" y="147.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">19</text><rect x="461.75" y="104" width="113.5" height="54" rx="4" fill="#ffffff" stroke="#8fa0b0" stroke-width="1.4"/><text x="518.5" y="132.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1b2733">set index</text><text x="518.5" y="147.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">6</text><rect x="575.25" y="104" width="60.5" height="54" rx="4" fill="#fbe6e6" stroke="#c2565c" stroke-width="1.4"/><text x="605.5" y="132.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1b2733">bank</text><text x="605.5" y="147.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">2</text><rect x="635.75" y="104" width="100.25" height="54" rx="4" fill="#ffffff" stroke="#8fa0b0" stroke-width="1.4"/><text x="685.875" y="132.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1b2733">offset</text><text x="685.875" y="147.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">5</text><text x="318.875" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">[31:13]</text><text x="518.5" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">[12:7]</text><text x="605.5" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">[6:5]</text><text x="685.875" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">[4:0]</text><text x="162" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" text-anchor="end" fill="#1b2733">addr[31:0]</text><text x="176" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="start" fill="#5b6b7c">31</text><text x="736" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="end" fill="#5b6b7c">0</text><rect x="176" y="200" width="285.75" height="28" rx="5" fill="none" stroke="#5a9e68" stroke-width="2.2"/><text x="162" y="219" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="650" text-anchor="end" fill="#5a9e68">L2 tag  19b</text><text x="750" y="219" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">bank is implied</text><rect x="461.75" y="242" width="113.5" height="28" rx="5" fill="none" stroke="#5b86c4" stroke-width="2.2"/><text x="162" y="261" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="650" text-anchor="end" fill="#5b86c4">index  6b</text><text x="750" y="261" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">L1 and L2 alike</text><rect x="176" y="284" width="285.75" height="28" rx="5" fill="none" stroke="#c2565c" stroke-width="2.2"/><rect x="575.25" y="284" width="60.5" height="28" rx="5" fill="none" stroke="#c2565c" stroke-width="2.2"/><text x="162" y="303" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="650" text-anchor="end" fill="#c2565c">L1 tag  21b</text><text x="750" y="303" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">two pieces</text><text x="456.0" y="336" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" text-anchor="middle" fill="#c2565c">L1 tag = { addr[31:13], addr[6:5] }  --  NON-CONTIGUOUS</text><rect x="60" y="358" width="860" height="112" rx="8" fill="#fbe6e6" stroke="#c2565c" stroke-width="1.4"/><text x="84" y="384" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" text-anchor="start" fill="#8d3b40">Why the hole is load-bearing</text><text x="84" y="404" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">Every L1 caches lines from all four banks, so the bank bits are not implied by the cache instance --</text><text x="84" y="418" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">and they sit below the index, so the index does not cover them either. Leave them out of the tag and</text><text x="84" y="432" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">two lines whose addresses differ only in home bank land in the same L1 set with the same tag, and</text><text x="84" y="446" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">alias onto each other. That is silent data corruption, and it is the first thing in coh_pkg.sv.</text></svg>
