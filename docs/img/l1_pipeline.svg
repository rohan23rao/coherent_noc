<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="960" viewBox="0 0 1240 960" role="img" aria-label="L1 cache — pipeline, and the order work is let in"><defs><marker id="a1b2733" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1b2733"/></marker><marker id="a5b6b7c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5b6b7c"/></marker><marker id="ac2565c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#c2565c"/></marker></defs><rect width="1240" height="960" fill="#ffffff"/><text x="24" y="30" font-family="system-ui, sans-serif" font-size="16" font-weight="650" fill="#1b2733">L1 cache — pipeline, and the order work is let in</text><text x="24" y="50" font-family="system-ui, sans-serif" font-size="11.5" fill="#5b6b7c">Three stages for the core's request, and three other classes of work that outrank it. The priority order is the deadlock argument, not a performance tuning knob.</text><rect x="60" y="132" width="250" height="92" rx="6" fill="#e4ecf7" stroke="#5b86c4" stroke-width="1.4"/><text x="185.0" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle" fill="#1b2733">S0   issue</text><text x="185.0" y="181.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">pick the replay or a new request,</text><text x="185.0" y="194.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">launch the tag and data read</text><rect x="360" y="132" width="320" height="92" rx="6" fill="#e4ecf7" stroke="#5b86c4" stroke-width="1.4"/><text x="520.0" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle" fill="#1b2733">S1   compare and decide</text><text x="520.0" y="181.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">tag compare, victim select,</text><text x="520.0" y="194.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">l1_coh_fsm lookup, MSHR allocate</text><rect x="730" y="132" width="250" height="92" rx="6" fill="#e4ecf7" stroke="#5b86c4" stroke-width="1.4"/><text x="855.0" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle" fill="#1b2733">S2   store commit</text><text x="855.0" y="181.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">merge the word into the line,</text><text x="855.0" y="194.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">write the data array</text><path d="M 310,178 L 360,178" fill="none" stroke="#1b2733" stroke-width="2.0" marker-end="url(#a1b2733)"/><path d="M 680,178 L 730,178" fill="none" stroke="#1b2733" stroke-width="2.0" marker-end="url(#a1b2733)"/><text x="1105" y="150" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#5b6b7c">one request in the pipe,</text><text x="1105" y="166" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#5b6b7c">but up to four transactions</text><text x="1105" y="182" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#5b6b7c">outstanding in the MSHR file</text><rect x="360" y="268" width="150" height="56" rx="6" fill="#fdf2d8" stroke="#d9a441" stroke-width="1.4"/><text x="435.0" y="295.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#1b2733">tag + state</text><text x="435.0" y="310.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">64 x 2</text><rect x="530" y="268" width="150" height="56" rx="6" fill="#fdf2d8" stroke="#d9a441" stroke-width="1.4"/><text x="605.0" y="295.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#1b2733">data array</text><text x="605.0" y="310.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">64 x 2 x 32 B</text><rect x="730" y="268" width="250" height="56" rx="6" fill="#fdf2d8" stroke="#d9a441" stroke-width="1.4"/><text x="855.0" y="295.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#1b2733">mshr_file</text><text x="855.0" y="310.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">4 entries · CAM on line address</text><path d="M 420,268 L 420,224" fill="none" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#a5b6b7c)"/><text x="412.0" y="246.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="end" fill="#5b6b7c">read</text><path d="M 590,268 L 590,224" fill="none" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#a5b6b7c)"/><path d="M 660,224 L 660,238 L 855,238 L 855,268" fill="none" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#a5b6b7c)"/><text x="770" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#5b6b7c">allocate</text><path d="M 820,224 L 820,256 L 650,256 L 650,268" fill="none" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#a5b6b7c)"/><text x="644" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="end" fill="#5b6b7c">write</text><text x="1180" y="340" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="650" text-anchor="end" fill="#1b2733">S1 has exactly four outcomes</text><path d="M 520,224 L 520,356 L 185,356 L 185,388" fill="none" stroke="#1b2733" stroke-width="1.4" marker-end="url(#a1b2733)"/><path d="M 185,356 L 1025,356" fill="none" stroke="#1b2733" stroke-width="1.4"/><rect x="60" y="388" width="250" height="62" rx="7" fill="#ffffff" stroke="#5a9e68" stroke-width="1.7"/><text x="185" y="412" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" text-anchor="middle" fill="#5a9e68">hit</text><text x="185" y="428" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#5b6b7c">the table says done —</text><text x="185" y="441" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#5b6b7c">answer the core now</text><path d="M 465,356 L 465,388" fill="none" stroke="#1b2733" stroke-width="1.4" marker-end="url(#a1b2733)"/><rect x="340" y="388" width="250" height="62" rx="7" fill="#ffffff" stroke="#c2565c" stroke-width="1.7"/><text x="465" y="412" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" text-anchor="middle" fill="#c2565c">allocate</text><text x="465" y="428" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#5b6b7c">miss or upgrade — take an MSHR,</text><text x="465" y="441" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#5b6b7c">send GetS / GetM on VN0</text><path d="M 745,356 L 745,388" fill="none" stroke="#1b2733" stroke-width="1.4" marker-end="url(#a1b2733)"/><rect x="620" y="388" width="250" height="62" rx="7" fill="#ffffff" stroke="#c2565c" stroke-width="1.7"/><text x="745" y="412" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" text-anchor="middle" fill="#c2565c">evict</text><text x="745" y="428" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#5b6b7c">victim is not I — its OWN MSHR,</text><text x="745" y="441" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#5b6b7c">send PutS / PutE / PutM</text><path d="M 1025,356 L 1025,388" fill="none" stroke="#1b2733" stroke-width="1.4" marker-end="url(#a1b2733)"/><rect x="900" y="388" width="250" height="62" rx="7" fill="#ffffff" stroke="#c2565c" stroke-width="1.7"/><text x="1025" y="412" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" text-anchor="middle" fill="#c2565c">replay</text><text x="1025" y="428" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#5b6b7c">anything else — S0 re-issues it,</text><text x="1025" y="441" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#5b6b7c">no state was changed</text><path d="M 1025,450 L 1025,482 L 140,482 L 140,224" fill="none" stroke="#c2565c" stroke-width="1.8" marker-end="url(#ac2565c)"/><text x="600" y="502" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#c2565c">an eviction REPLAYS too: issuing the Put only frees the way, it does not serve the request  (bug B9)</text><text x="60" y="542" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="650" text-anchor="start" fill="#1b2733">Who gets the array port, the MSHR update port and the VN0 queue — highest first</text><rect x="60" y="564" width="1120" height="56" rx="7" fill="#ffffff" stroke="#3f7fb5" stroke-width="1.6"/><rect x="60" y="564" width="8" height="56" rx="3" fill="#3f7fb5" stroke="#3f7fb5" stroke-width="1.4"/><text x="92" y="598" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" text-anchor="middle" fill="#3f7fb5">1</text><text x="120" y="589" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="650" text-anchor="start" fill="#3f7fb5">VN2 response</text><text x="120" y="606" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#5b6b7c">may never be refused</text><text x="1160" y="598" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="end" fill="#1b2733">it is the sink the whole dependency argument rests on, so it takes the MSHR update port outright</text><rect x="60" y="628" width="1120" height="56" rx="7" fill="#ffffff" stroke="#5a9e68" stroke-width="1.6"/><rect x="60" y="628" width="8" height="56" rx="3" fill="#5a9e68" stroke="#5a9e68" stroke-width="1.4"/><text x="92" y="662" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" text-anchor="middle" fill="#5a9e68">2</text><text x="120" y="653" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="650" text-anchor="start" fill="#5a9e68">retirement</text><text x="120" y="670" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#5b6b7c">cannot be refused either</text><text x="1160" y="662" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="end" fill="#1b2733">the transaction is already complete; holding it would hold an MSHR another core is waiting on</text><rect x="60" y="692" width="1120" height="56" rx="7" fill="#ffffff" stroke="#d9a441" stroke-width="1.6"/><rect x="60" y="692" width="8" height="56" rx="3" fill="#d9a441" stroke="#d9a441" stroke-width="1.4"/><text x="92" y="726" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" text-anchor="middle" fill="#d9a441">3</text><text x="120" y="717" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="650" text-anchor="start" fill="#d9a441">VN1 forward</text><text x="120" y="734" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#5b6b7c">may stall, on a transient state only</text><text x="1160" y="726" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="end" fill="#1b2733">stalling a forward only delays this tile; the directory that sent it is not blocked behind it</text><rect x="60" y="756" width="1120" height="56" rx="7" fill="#ffffff" stroke="#5b6b7c" stroke-width="1.6"/><rect x="60" y="756" width="8" height="56" rx="3" fill="#5b6b7c" stroke="#5b6b7c" stroke-width="1.4"/><text x="92" y="790" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" text-anchor="middle" fill="#5b6b7c">4</text><text x="120" y="781" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="650" text-anchor="start" fill="#5b6b7c">core request</text><text x="120" y="798" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#5b6b7c">lowest, and may stall for any reason</text><text x="1160" y="790" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="end" fill="#1b2733">a core that keeps issuing can never starve the responses that let the other three cores finish</text><rect x="60" y="836" width="1120" height="92" rx="8" fill="#fbe6e6" stroke="#c2565c" stroke-width="1.4"/><text x="84" y="862" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" text-anchor="start" fill="#8d3b40">The rule that is easy to get wrong</text><text x="84" y="882" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">Priority is not enough. S1 must also YIELD to the forward and response handlers when they are working on the same line.</text><text x="84" y="896" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">All three write a line's state at the same edge and S1's write lands last, so without that rule S1 silently undoes a transition</text><text x="84" y="910" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">that has already been announced to the rest of the machine. See bug B20, decision D23, and the next diagram.</text></svg>
