<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="840" viewBox="0 0 1240 840" role="img" aria-label="Point-to-point ordering on VN1 — the property the protocol assumed and the network did not have"><defs><marker id="ad9a441" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#d9a441"/></marker></defs><rect width="1240" height="840" fill="#ffffff"/><text x="24" y="30" font-family="system-ui, sans-serif" font-size="16" font-weight="650" fill="#1b2733">Point-to-point ordering on VN1 — the property the protocol assumed and the network did not have</text><text x="24" y="50" font-family="system-ui, sans-serif" font-size="11.5" fill="#5b6b7c">One sender, one receiver, one virtual network, two messages — and the second one was delivered first.  (bug B19, decision D22)</text><rect x="60" y="110" width="540" height="300" rx="10" fill="#ffffff" stroke="#c2565c" stroke-width="1.8"/><text x="84" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" text-anchor="start" fill="#c2565c">BEFORE — lowest free VC, chosen again at every hop</text><rect x="84" y="158" width="110" height="52" rx="6" fill="#e8f3ea" stroke="#5a9e68" stroke-width="1.4"/><text x="139.0" y="183.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#1b2733">bank 2</text><text x="139.0" y="198.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">directory</text><rect x="466" y="158" width="110" height="52" rx="6" fill="#e4ecf7" stroke="#5b86c4" stroke-width="1.4"/><text x="521.0" y="183.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#1b2733">tile 2</text><text x="521.0" y="198.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">L1, in MI_A</text><rect x="84" y="238" width="492" height="52" rx="7" fill="#fbfcfd" stroke="#b9c6d3" stroke-width="1.2"/><text x="100" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" text-anchor="start" fill="#d9a441">VC 0</text><text x="100" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733">Fwd-GetS(0xa)  sent at 1431</text><text x="560" y="269" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.5" font-weight="normal" text-anchor="end" fill="#5b6b7c">stalls behind an earlier packet</text><rect x="84" y="302" width="492" height="52" rx="7" fill="#fbfcfd" stroke="#b9c6d3" stroke-width="1.2"/><text x="100" y="324" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" text-anchor="start" fill="#d9a441">VC 1</text><text x="100" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733">Put-Ack(0xa)   sent at 1436</text><text x="560" y="333" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.5" font-weight="normal" text-anchor="end" fill="#5b6b7c">free channel, no queue</text><path d="M 194,184 L 466,184" fill="none" stroke="#d9a441" stroke-width="2.0" marker-end="url(#ad9a441)"/><text x="330" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#d9a441">VN1</text><text x="330" y="398" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" text-anchor="middle" fill="#c2565c">arrives 1444 Put-Ack, then 1445 Fwd-GetS  —  ILLEGAL</text><rect x="640" y="110" width="540" height="300" rx="10" fill="#ffffff" stroke="#5a9e68" stroke-width="1.8"/><text x="664" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" text-anchor="start" fill="#5a9e68">AFTER — VC index = src_vc_id(sending tile), kept for the whole path</text><rect x="664" y="158" width="110" height="52" rx="6" fill="#e8f3ea" stroke="#5a9e68" stroke-width="1.4"/><text x="719.0" y="183.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#1b2733">bank 2</text><text x="719.0" y="198.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">directory</text><rect x="1046" y="158" width="110" height="52" rx="6" fill="#e4ecf7" stroke="#5b86c4" stroke-width="1.4"/><text x="1101.0" y="183.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#1b2733">tile 2</text><text x="1101.0" y="198.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">L1, in MI_A</text><rect x="664" y="238" width="492" height="52" rx="7" fill="#fbfcfd" stroke="#b9c6d3" stroke-width="1.2"/><text x="680" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" text-anchor="start" fill="#d9a441">VC 0</text><text x="680" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733">Fwd-GetS(0xa)  then  Put-Ack(0xa)</text><text x="1140" y="269" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.5" font-weight="normal" text-anchor="end" fill="#5b6b7c">one channel, so one queue</text><rect x="664" y="302" width="492" height="52" rx="7" fill="#fbfcfd" stroke="#b9c6d3" stroke-width="1.2"/><text x="680" y="324" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" text-anchor="start" fill="#d9a441">VC 1</text><text x="680" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733">(used by the tiles whose id has bit 0 set)</text><text x="1140" y="333" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.5" font-weight="normal" text-anchor="end" fill="#5b6b7c">an independent subnetwork</text><path d="M 774,184 L 1046,184" fill="none" stroke="#d9a441" stroke-width="2.0" marker-end="url(#ad9a441)"/><text x="910" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#d9a441">VN1</text><text x="910" y="398" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" text-anchor="middle" fill="#2f7a42">arrives Fwd-GetS, then Put-Ack  —  the order they were sent</text><rect x="60" y="438" width="1120" height="150" rx="10" fill="#fdf6f6" stroke="#c2565c" stroke-width="1.4"/><text x="84" y="466" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" text-anchor="start" fill="#8d3b40">Why the protocol needs this, stated plainly</text><text x="84" y="488" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">The directory sends a cache a forward, and later, on processing that cache's Put, a Put-Ack. The forward is legal in MI_A; after the Put-Ack the</text><text x="84" y="502" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">cache is in I, where it has neither data to answer with nor a transaction to answer for. The table cell is blank precisely because a correct directory never</text><text x="84" y="516" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">sends a forward after the ack — which is true of the SENDING order and says nothing about the ARRIVAL order.</text><text x="84" y="530" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c"></text><text x="84" y="544" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">No directed test would have found it: it needs a forward and a Put-Ack in flight to the same cache at the same moment, which is a coincidence,</text><text x="84" y="558" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">not an interleaving anybody would think to arrange. test_stress_16_lines finds it within a few thousand requests.</text><rect x="60" y="614" width="730" height="140" rx="10" fill="#f7f9fb" stroke="#b9c6d3" stroke-width="1.4"/><text x="84" y="642" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="650" text-anchor="start" fill="#1b2733">The fix, in one function</text><text x="84" y="668" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1b2733">function automatic logic [VC_ID_W-1:0] src_vc_id(input logic [TILE_ID_W-1:0] t);</text><text x="84" y="686" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1b2733">  return t[VC_ID_W-1:0];</text><text x="84" y="704" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1b2733">endfunction</text><text x="84" y="726" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">The NIC injects on src_vc_id(TILE_ID) and waits if it is busy; the VC allocator's candidate is the input VC's own index,</text><text x="84" y="740" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">not the lowest free one. a_same_vc says a grant never moves a packet between channels.</text><rect x="810" y="614" width="370" height="140" rx="10" fill="#f7f9fb" stroke="#b9c6d3" stroke-width="1.4"/><text x="834" y="642" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="650" text-anchor="start" fill="#1b2733">What it costs  (D22)</text><text x="834" y="664" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">Channel utilisation. A blocked packet now waits</text><text x="834" y="678" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">for one specific channel rather than any free one</text><text x="834" y="692" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">in its vnet.</text><text x="834" y="706" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c"></text><text x="834" y="720" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">Measured: 10-15% mean latency below the knee,</text><text x="834" y="734" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">no change at saturation.</text></svg>
