<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-label="Packet and flit format"><defs><marker id="a5b6b7c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5b6b7c"/></marker></defs><rect width="980" height="560" fill="#ffffff"/><text x="24" y="30" font-family="system-ui, sans-serif" font-size="16" font-weight="650" fill="#1b2733">Packet and flit format</text><text x="24" y="50" font-family="system-ui, sans-serif" font-size="11.5" fill="#5b6b7c">Wormhole with virtual channels: a control message is one head+tail flit, a data message is head plus two body flits.</text><text x="60" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="650" text-anchor="start" fill="#1b2733">flit_t  —  137 bits, the unit on every link</text><text x="920" y="86" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="end" fill="#5b6b7c">one flit per cycle per port</text><rect x="60" y="100" width="38.29197080291971" height="48" rx="4" fill="#e4ecf7" stroke="#5b86c4" stroke-width="1.4"/><g transform="translate(79.14598540145985,124.0) rotate(-90)"><text x="0" y="4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="600" text-anchor="middle" fill="#1b2733">head 1</text></g><rect x="98.2919708029197" y="100" width="38.29197080291971" height="48" rx="4" fill="#e4ecf7" stroke="#5b86c4" stroke-width="1.4"/><g transform="translate(117.43795620437956,124.0) rotate(-90)"><text x="0" y="4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="600" text-anchor="middle" fill="#1b2733">tail 1</text></g><rect x="136.5839416058394" y="100" width="42.583941605839414" height="48" rx="4" fill="#e4ecf7" stroke="#5b86c4" stroke-width="1.4"/><g transform="translate(157.87591240875912,124.0) rotate(-90)"><text x="0" y="4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="600" text-anchor="middle" fill="#1b2733">vnet 2</text></g><rect x="179.16788321167883" y="100" width="38.29197080291971" height="48" rx="4" fill="#e4ecf7" stroke="#5b86c4" stroke-width="1.4"/><g transform="translate(198.31386861313868,124.0) rotate(-90)"><text x="0" y="4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="600" text-anchor="middle" fill="#1b2733">vc_id 1</text></g><rect x="217.45985401459853" y="100" width="38.29197080291971" height="48" rx="4" fill="#f0e9f6" stroke="#8d6cae" stroke-width="1.4"/><g transform="translate(236.6058394160584,124.0) rotate(-90)"><text x="0" y="4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="600" text-anchor="middle" fill="#1b2733">dst_x 1</text></g><rect x="255.75182481751824" y="100" width="38.29197080291971" height="48" rx="4" fill="#f0e9f6" stroke="#8d6cae" stroke-width="1.4"/><g transform="translate(274.89781021897807,124.0) rotate(-90)"><text x="0" y="4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="600" text-anchor="middle" fill="#1b2733">dst_y 1</text></g><rect x="294.04379562043795" y="100" width="42.583941605839414" height="48" rx="4" fill="#f0e9f6" stroke="#8d6cae" stroke-width="1.4"/><g transform="translate(315.33576642335765,124.0) rotate(-90)"><text x="0" y="4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.333333333333334" font-weight="600" text-anchor="middle" fill="#1b2733">src_id 2</text></g><rect x="336.62773722627736" y="100" width="583.3722627737226" height="48" rx="4" fill="#e8f3ea" stroke="#5a9e68" stroke-width="1.4"/><text x="628.3138686131387" y="125.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1b2733">payload</text><text x="628.3138686131387" y="140.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">128</text><path d="M 560,152 L 560,212" fill="none" stroke="#5b6b7c" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a5b6b7c)"/><text x="548" y="186" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="end" fill="#5b6b7c">on a HEAD flit the payload carries:</text><text x="60" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="650" text-anchor="start" fill="#1b2733">head_payload_t  —  37 of the 128 payload bits</text><text x="920" y="218" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="end" fill="#5b6b7c">91 bits spare, which is where the 5-bit msg_type came from</text><rect x="60" y="232" width="101.1875" height="48" rx="4" fill="#e4ecf7" stroke="#5b86c4" stroke-width="1.4"/><text x="110.59375" y="257.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1b2733">msg_type</text><text x="110.59375" y="272.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">5</text><rect x="161.1875" y="232" width="176.8125" height="48" rx="4" fill="#e4ecf7" stroke="#5b86c4" stroke-width="1.4"/><text x="249.59375" y="257.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1b2733">addr</text><text x="249.59375" y="272.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">27</text><rect x="338.0" y="232" width="90.875" height="48" rx="4" fill="#e4ecf7" stroke="#5b86c4" stroke-width="1.4"/><text x="383.4375" y="257.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1b2733">requester</text><text x="383.4375" y="272.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">2</text><rect x="428.875" y="232" width="94.3125" height="48" rx="4" fill="#e4ecf7" stroke="#5b86c4" stroke-width="1.4"/><text x="476.03125" y="257.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1b2733">ack_count</text><text x="476.03125" y="272.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">3</text><rect x="523.1875" y="232" width="396.8125" height="48" rx="4" fill="#eef1f4" stroke="#8fa0b0" stroke-width="1.4"/><text x="721.59375" y="257.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1b2733">unused</text><text x="721.59375" y="272.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">91</text><text x="60" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="650" text-anchor="start" fill="#1b2733">body flit  —  payload is line data, two per 256-bit line</text><rect x="60" y="346" width="860.0" height="48" rx="4" fill="#e8f3ea" stroke="#5a9e68" stroke-width="1.4"/><text x="490.0" y="371.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1b2733">data[127:0]</text><text x="490.0" y="386.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">128</text><rect x="60" y="422" width="420" height="116" rx="8" fill="#f7f9fb" stroke="#b9c6d3" stroke-width="1.4"/><text x="82" y="446" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="650" text-anchor="start" fill="#1b2733">Packet lengths</text><text x="82" y="468" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733">control  GetS, Inv, Put-Ack, ...</text><text x="300" y="468" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="start" fill="#5b6b7c">1 flit   head and tail in one</text><text x="82" y="485" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733">data     Data, WB-Data, PutM, ...</text><text x="300" y="485" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="start" fill="#5b6b7c">3 flits  head + 2 body</text><text x="82" y="516" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1b2733">So a VC buffer never holds more than three flits.</text><rect x="500" y="422" width="420" height="116" rx="8" fill="#f7f9fb" stroke="#b9c6d3" stroke-width="1.4"/><text x="522" y="446" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="650" text-anchor="start" fill="#1b2733">Why VC_DEPTH is 4, and why occupancy 4 never happens</text><text x="522" y="466" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">A VC carries one packet at a time and is not released until</text><text x="522" y="480" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">its tail's credit returns. The longest packet is three flits,</text><text x="522" y="494" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">so three is the deepest a buffer gets. The fourth slot is there</text><text x="522" y="508" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">so a credit round trip does not stall a full channel.</text></svg>
