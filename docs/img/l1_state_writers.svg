<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="880" viewBox="0 0 1240 880" role="img" aria-label="Three writers of one line's coherence state — and the rule that orders them"><defs><marker id="a5b6b7c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5b6b7c"/></marker><marker id="ad9a441" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#d9a441"/></marker><marker id="a3f7fb5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#3f7fb5"/></marker></defs><rect width="1240" height="880" fill="#ffffff"/><text x="24" y="30" font-family="system-ui, sans-serif" font-size="16" font-weight="650" fill="#1b2733">Three writers of one line's coherence state — and the rule that orders them</text><text x="24" y="50" font-family="system-ui, sans-serif" font-size="11.5" fill="#5b6b7c">The tag array is the single source of truth for a line's state, transient states included. Three units write it, all on the same clock edge.</text><rect x="60" y="108" width="320" height="84" rx="8" fill="#ffffff" stroke="#5b6b7c" stroke-width="1.8"/><text x="220" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" text-anchor="middle" fill="#5b6b7c">S1  —  core pipeline</text><text x="220" y="152" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">installs a transient state on a miss,</text><text x="220" y="166" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">an upgrade, or an eviction</text><text x="220" y="186" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">writes LAST in the always_ff, so it wins by default</text><path d="M 220,192 L 220,224 L 500,224 L 500,268" fill="none" stroke="#5b6b7c" stroke-width="2.0" marker-end="url(#a5b6b7c)"/><rect x="460" y="108" width="320" height="84" rx="8" fill="#ffffff" stroke="#d9a441" stroke-width="1.8"/><text x="620" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" text-anchor="middle" fill="#d9a441">VN1 forward handler</text><text x="620" y="152" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">M -&gt; S on a Fwd-GetS, anything -&gt; I</text><text x="620" y="166" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">on an Inv or a Recall</text><text x="620" y="186" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#d9a441">has already sent the data or the ack away</text><path d="M 620,192 L 620,268" fill="none" stroke="#d9a441" stroke-width="2.0" marker-end="url(#ad9a441)"/><rect x="860" y="108" width="320" height="84" rx="8" fill="#ffffff" stroke="#3f7fb5" stroke-width="1.8"/><text x="1020" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" text-anchor="middle" fill="#3f7fb5">VN2 response handler</text><text x="1020" y="152" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">IM_AD -&gt; IM_A, SM_AD -&gt; SM_A,</text><text x="1020" y="166" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">transient -&gt; stable at retirement</text><text x="1020" y="186" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#3f7fb5">is a sink: it cannot be refused or deferred</text><path d="M 1020,192 L 1020,238 L 740,238 L 740,268" fill="none" stroke="#3f7fb5" stroke-width="2.0" marker-end="url(#a3f7fb5)"/><rect x="400" y="268" width="440" height="62" rx="6" fill="#fdf2d8" stroke="#d9a441" stroke-width="1.4"/><text x="620.0" y="298.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle" fill="#1b2733">tag + state array</text><text x="620.0" y="313.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">one state field per way — 13 values, transient included</text><rect x="60" y="366" width="1120" height="78" rx="8" fill="#fbe6e6" stroke="#c2565c" stroke-width="1.4"/><text x="84" y="392" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" text-anchor="start" fill="#8d3b40">Winning by default is the bug</text><text x="84" y="412" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">All three read the state combinationally and write it at the same edge. S1's assignment is later in the always_ff, so S1 overwrites</text><text x="84" y="426" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">whatever the other two decided — and they have already put a message on the wire that says otherwise.</text><rect x="60" y="470" width="1120" height="92" rx="8" fill="#eef4fa" stroke="#3f7fb5" stroke-width="1.4"/><text x="84" y="496" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" text-anchor="start" fill="#1f5a86">The rule  (decision D23)</text><text x="84" y="522" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" text-anchor="start" fill="#1b2733">s1_coh_conflict = (VN1 presented for this set and way)  ||  (VN2 taken for this set and way)</text><text x="84" y="546" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">and s1_coh_conflict suppresses s1_resp, s1_alloc and s1_evict — so the request REPLAYS and the coherence write stands.</text><rect x="60" y="590" width="540" height="208" rx="8" fill="#ffffff" stroke="#d9a441" stroke-width="1.6"/><text x="80" y="616" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" text-anchor="start" fill="#d9a441">What S1 clobbered on VN1</text><text x="80" y="638" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733">A Fwd-GetS is accepted for a line in M in the same</text><text x="80" y="653" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733">cycle as a store HIT on that line.</text><text x="80" y="668" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733"></text><text x="80" y="683" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733">The handler sends the data to the requester and moves</text><text x="80" y="698" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733">the line to S. S1 writes M back. The cache then evicts</text><text x="80" y="713" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733">with a PutM a line the directory has just told everyone</text><text x="80" y="728" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733">is shared, and the Inv that follows lands in MI_A,</text><text x="80" y="743" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733">which has no arc for it.</text><text x="80" y="758" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733"></text><text x="80" y="773" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733">Caught by: test_stress racing configuration -&gt; B20</text><rect x="640" y="590" width="540" height="208" rx="8" fill="#ffffff" stroke="#3f7fb5" stroke-width="1.6"/><text x="660" y="616" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" text-anchor="start" fill="#3f7fb5">What S1 clobbered on VN2</text><text x="660" y="638" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733">A load HITS a line in SM_AD — legal, a shared copy is</text><text x="660" y="653" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733">still readable while the upgrade is outstanding.</text><text x="660" y="668" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733"></text><text x="660" y="683" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733">In the same cycle Data+AckCount arrives and writes</text><text x="660" y="698" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733">SM_A. S1 writes SM_AD back. The ack count then reaches</text><text x="660" y="713" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733">zero in a state with no completion arc, the MSHR never</text><text x="660" y="728" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733">retires, and the cache waits forever for acks it has</text><text x="660" y="743" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733">already had.</text><text x="660" y="758" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733"></text><text x="660" y="773" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733">Caught by: test_stress racing configuration -&gt; B20</text><text x="60" y="826" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">Two details that are not arbitrary. The condition is VN1 *valid*, not VN1 *taken*: a forward can sit at the input for several cycles while the handler</text><text x="60" y="840" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">finishes an earlier one, and S1 touching the line during that window is the same bug with a wider gap — and using `taken` would close a combinational</text><text x="60" y="854" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">loop, since it depends on retirement, which depends on S1. And it cannot livelock: a forward is taken in bounded time, after which the conflict clears.</text></svg>
