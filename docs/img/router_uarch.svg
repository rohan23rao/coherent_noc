<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" role="img" aria-label="Router — three stages, five ports, six VCs per port"><defs><marker id="a1b2733" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1b2733"/></marker><marker id="a5a9e68" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5a9e68"/></marker></defs><rect width="1240" height="900" fill="#ffffff"/><text x="24" y="30" font-family="system-ui, sans-serif" font-size="16" font-weight="650" fill="#1b2733">Router — three stages, five ports, six VCs per port</text><text x="24" y="50" font-family="system-ui, sans-serif" font-size="11.5" fill="#5b6b7c">Input-buffered, virtual-channel, credit flow control, XY routing. All outputs registered, so the link is a wire and nothing else.</text><rect x="60" y="104" width="300" height="34" rx="8" fill="#eef1f4" stroke="#b9c6d3" stroke-width="1.2"/><text x="210.0" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" text-anchor="middle" fill="#1b2733">BW + RC</text><text x="210.0" y="156" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#5b6b7c">buffer write, route compute</text><rect x="392" y="104" width="300" height="34" rx="8" fill="#eef1f4" stroke="#b9c6d3" stroke-width="1.2"/><text x="542.0" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" text-anchor="middle" fill="#1b2733">VA + SA</text><text x="542.0" y="156" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#5b6b7c">VC allocate, switch allocate</text><rect x="724" y="104" width="220" height="34" rx="8" fill="#eef1f4" stroke="#b9c6d3" stroke-width="1.2"/><text x="834.0" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" text-anchor="middle" fill="#1b2733">ST</text><text x="834.0" y="156" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#5b6b7c">crossbar traversal, registered out</text><rect x="976" y="104" width="204" height="34" rx="8" fill="#eef1f4" stroke="#b9c6d3" stroke-width="1.2"/><text x="1078.0" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" text-anchor="middle" fill="#1b2733">LT</text><text x="1078.0" y="156" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#5b6b7c">link traversal — the wire</text><rect x="60" y="176" width="300" height="300" rx="10" fill="none" stroke="#d9a441" stroke-width="1.2" stroke-dasharray="5 4"/><text x="72" y="193" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" text-anchor="start" fill="#d9a441">input_unit  x5  (N E S W Local)</text><rect x="80" y="206" width="150" height="28" rx="5" fill="#ffffff" stroke="#c2565c" stroke-width="1.4"/><text x="155" y="225" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600" text-anchor="middle" fill="#c2565c">VN0 vc0</text><rect x="240" y="210" width="18" height="20" rx="3" fill="#ffffff" stroke="#b9c6d3" stroke-width="1.0"/><rect x="262" y="210" width="18" height="20" rx="3" fill="#ffffff" stroke="#b9c6d3" stroke-width="1.0"/><rect x="284" y="210" width="18" height="20" rx="3" fill="#ffffff" stroke="#b9c6d3" stroke-width="1.0"/><rect x="306" y="210" width="18" height="20" rx="3" fill="#ffffff" stroke="#b9c6d3" stroke-width="1.0"/><rect x="80" y="240" width="150" height="28" rx="5" fill="#ffffff" stroke="#c2565c" stroke-width="1.4"/><text x="155" y="259" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600" text-anchor="middle" fill="#c2565c">VN0 vc1</text><rect x="240" y="244" width="18" height="20" rx="3" fill="#ffffff" stroke="#b9c6d3" stroke-width="1.0"/><rect x="262" y="244" width="18" height="20" rx="3" fill="#ffffff" stroke="#b9c6d3" stroke-width="1.0"/><rect x="284" y="244" width="18" height="20" rx="3" fill="#ffffff" stroke="#b9c6d3" stroke-width="1.0"/><rect x="306" y="244" width="18" height="20" rx="3" fill="#ffffff" stroke="#b9c6d3" stroke-width="1.0"/><rect x="80" y="274" width="150" height="28" rx="5" fill="#ffffff" stroke="#d9a441" stroke-width="1.4"/><text x="155" y="293" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600" text-anchor="middle" fill="#d9a441">VN1 vc0</text><rect x="240" y="278" width="18" height="20" rx="3" fill="#ffffff" stroke="#b9c6d3" stroke-width="1.0"/><rect x="262" y="278" width="18" height="20" rx="3" fill="#ffffff" stroke="#b9c6d3" stroke-width="1.0"/><rect x="284" y="278" width="18" height="20" rx="3" fill="#ffffff" stroke="#b9c6d3" stroke-width="1.0"/><rect x="306" y="278" width="18" height="20" rx="3" fill="#ffffff" stroke="#b9c6d3" stroke-width="1.0"/><rect x="80" y="308" width="150" height="28" rx="5" fill="#ffffff" stroke="#d9a441" stroke-width="1.4"/><text x="155" y="327" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600" text-anchor="middle" fill="#d9a441">VN1 vc1</text><rect x="240" y="312" width="18" height="20" rx="3" fill="#ffffff" stroke="#b9c6d3" stroke-width="1.0"/><rect x="262" y="312" width="18" height="20" rx="3" fill="#ffffff" stroke="#b9c6d3" stroke-width="1.0"/><rect x="284" y="312" width="18" height="20" rx="3" fill="#ffffff" stroke="#b9c6d3" stroke-width="1.0"/><rect x="306" y="312" width="18" height="20" rx="3" fill="#ffffff" stroke="#b9c6d3" stroke-width="1.0"/><rect x="80" y="342" width="150" height="28" rx="5" fill="#ffffff" stroke="#3f7fb5" stroke-width="1.4"/><text x="155" y="361" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600" text-anchor="middle" fill="#3f7fb5">VN2 vc0</text><rect x="240" y="346" width="18" height="20" rx="3" fill="#ffffff" stroke="#b9c6d3" stroke-width="1.0"/><rect x="262" y="346" width="18" height="20" rx="3" fill="#ffffff" stroke="#b9c6d3" stroke-width="1.0"/><rect x="284" y="346" width="18" height="20" rx="3" fill="#ffffff" stroke="#b9c6d3" stroke-width="1.0"/><rect x="306" y="346" width="18" height="20" rx="3" fill="#ffffff" stroke="#b9c6d3" stroke-width="1.0"/><rect x="80" y="376" width="150" height="28" rx="5" fill="#ffffff" stroke="#3f7fb5" stroke-width="1.4"/><text x="155" y="395" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600" text-anchor="middle" fill="#3f7fb5">VN2 vc1</text><rect x="240" y="380" width="18" height="20" rx="3" fill="#ffffff" stroke="#b9c6d3" stroke-width="1.0"/><rect x="262" y="380" width="18" height="20" rx="3" fill="#ffffff" stroke="#b9c6d3" stroke-width="1.0"/><rect x="284" y="380" width="18" height="20" rx="3" fill="#ffffff" stroke="#b9c6d3" stroke-width="1.0"/><rect x="306" y="380" width="18" height="20" rx="3" fill="#ffffff" stroke="#b9c6d3" stroke-width="1.0"/><text x="264" y="424" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">VC_DEPTH = 4 flits</text><text x="210" y="452" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">route_compute: XY, purely combinational from the head</text><rect x="392" y="190" width="300" height="108" rx="6" fill="#e4ecf7" stroke="#5b86c4" stroke-width="1.4"/><text x="542.0" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle" fill="#1b2733">vc_allocator</text><text x="542.0" y="235.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">picks an output VC for each head flit</text><text x="542.0" y="248.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">VC index = f(source tile), never 'any free one'</text><text x="542.0" y="262.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">so a pair of tiles keeps one FIFO subnetwork</text><rect x="392" y="318" width="300" height="100" rx="6" fill="#e4ecf7" stroke="#5b86c4" stroke-width="1.4"/><text x="542.0" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle" fill="#1b2733">switch_allocator</text><text x="542.0" y="361.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">per-flit, separable input-first then</text><text x="542.0" y="374.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">output-first round robin — one winner</text><text x="542.0" y="388.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">per input port and per output port</text><path d="M 360,250 L 392,250" fill="none" stroke="#1b2733" stroke-width="1.8" marker-end="url(#a1b2733)"/><path d="M 360,366 L 392,366" fill="none" stroke="#1b2733" stroke-width="1.8" marker-end="url(#a1b2733)"/><path d="M 542,298 L 542,318" fill="none" stroke="#1b2733" stroke-width="1.6" marker-end="url(#a1b2733)"/><rect x="724" y="190" width="220" height="228" rx="6" fill="#e8f3ea" stroke="#5a9e68" stroke-width="1.4"/><text x="834.0" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle" fill="#1b2733">crossbar</text><text x="834.0" y="315.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">5 x 5, one flit per</text><text x="834.0" y="328.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">output port per cycle</text><path d="M 692,250 L 724,250" fill="none" stroke="#1b2733" stroke-width="1.8" marker-end="url(#a1b2733)"/><path d="M 692,366 L 724,366" fill="none" stroke="#1b2733" stroke-width="1.8" marker-end="url(#a1b2733)"/><rect x="976" y="200" width="96" height="34" rx="5" fill="#e4ecf7" stroke="#5b86c4" stroke-width="1.4"/><text x="1024" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#1b2733">reg N</text><path d="M 944,217 L 976,217" fill="none" stroke="#1b2733" stroke-width="1.4" marker-end="url(#a1b2733)"/><path d="M 1072,217 L 1172,217" fill="none" stroke="#1b2733" stroke-width="1.6" marker-end="url(#a1b2733)"/><rect x="976" y="244" width="96" height="34" rx="5" fill="#e4ecf7" stroke="#5b86c4" stroke-width="1.4"/><text x="1024" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#1b2733">reg E</text><path d="M 944,261 L 976,261" fill="none" stroke="#1b2733" stroke-width="1.4" marker-end="url(#a1b2733)"/><path d="M 1072,261 L 1172,261" fill="none" stroke="#1b2733" stroke-width="1.6" marker-end="url(#a1b2733)"/><rect x="976" y="288" width="96" height="34" rx="5" fill="#e4ecf7" stroke="#5b86c4" stroke-width="1.4"/><text x="1024" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#1b2733">reg S</text><path d="M 944,305 L 976,305" fill="none" stroke="#1b2733" stroke-width="1.4" marker-end="url(#a1b2733)"/><path d="M 1072,305 L 1172,305" fill="none" stroke="#1b2733" stroke-width="1.6" marker-end="url(#a1b2733)"/><rect x="976" y="332" width="96" height="34" rx="5" fill="#e4ecf7" stroke="#5b86c4" stroke-width="1.4"/><text x="1024" y="354" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#1b2733">reg W</text><path d="M 944,349 L 976,349" fill="none" stroke="#1b2733" stroke-width="1.4" marker-end="url(#a1b2733)"/><path d="M 1072,349 L 1172,349" fill="none" stroke="#1b2733" stroke-width="1.6" marker-end="url(#a1b2733)"/><rect x="976" y="376" width="96" height="34" rx="5" fill="#e4ecf7" stroke="#5b86c4" stroke-width="1.4"/><text x="1024" y="398" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#1b2733">reg L</text><path d="M 944,393 L 976,393" fill="none" stroke="#1b2733" stroke-width="1.4" marker-end="url(#a1b2733)"/><path d="M 1072,393 L 1172,393" fill="none" stroke="#1b2733" stroke-width="1.6" marker-end="url(#a1b2733)"/><rect x="392" y="444" width="552" height="56" rx="8" fill="#ffffff" stroke="#5a9e68" stroke-width="1.6"/><text x="668" y="468" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" text-anchor="middle" fill="#5a9e68">credit_counter — one per output VC</text><text x="668" y="486" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#5b6b7c">a flit sent spends a credit; the downstream returns it when that flit leaves its buffer</text><path d="M 1172,440 L 944,440 L 944,472" fill="none" stroke="#5a9e68" stroke-width="1.6" marker-end="url(#a5a9e68)"/><text x="1100" y="432" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#5a9e68">credits back</text><rect x="60" y="536" width="560" height="170" rx="8" fill="#f7f9fb" stroke="#5b86c4" stroke-width="1.4"/><text x="84" y="562" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" text-anchor="start" fill="#2f5c93">An output VC is released on the TAIL's CREDIT  (D9)</text><text x="84" y="582" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">Not when this router sends the tail. That is one credit round</text><text x="84" y="596" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">trip of extra occupancy per VC, and it is what guarantees a head</text><text x="84" y="610" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">flit never arrives at a downstream VC that is still draining the</text><text x="84" y="624" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">previous packet. With two VCs per vnet the sibling covers the gap,</text><text x="84" y="638" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">so the throughput cost is small and the correctness is absolute.</text><text x="84" y="652" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c"></text><text x="84" y="666" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">Measured: no change in saturation throughput, ~1 cycle of latency.</text><rect x="640" y="536" width="540" height="170" rx="8" fill="#fdf6f6" stroke="#c2565c" stroke-width="1.4"/><text x="664" y="562" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" text-anchor="start" fill="#8d3b40">Arbitration is per FLIT, not per packet</text><text x="664" y="582" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">Wormhole routing requires a packet's flits to be contiguous on</text><text x="664" y="596" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">its VIRTUAL CHANNEL, not on the physical port. Two packets on</text><text x="664" y="610" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">different VCs may interleave on the wire; two packets on the same</text><text x="664" y="624" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">VC may not, and VC allocation never lets that happen.</text><text x="664" y="638" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c"></text><text x="664" y="652" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">The router test checks the stronger property: split each output</text><text x="664" y="666" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">VC's flit stream at tail boundaries and every piece is one packet.</text><text x="60" y="742" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">Sizing, and why each number is what it is.  5 ports: four neighbours and the local tile.  6 VCs per port: three virtual networks x 2, and the</text><text x="60" y="756" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">second VC per vnet exists so a blocked packet does not idle the vnet — one per vnet is correct but leaves measurable throughput on the table.</text><text x="60" y="770" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">4 flits per VC buffer: the longest packet is 3 flits (head + 2 body) and the fourth slot covers the credit round trip.  Occupancy 4 is therefore</text><text x="60" y="784" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">unreachable by construction, which is one of the coverage exclusions with a written argument rather than a waiver.</text></svg>
