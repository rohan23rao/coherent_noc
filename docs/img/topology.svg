<svg xmlns="http://www.w3.org/2000/svg" width="980" height="812" viewBox="0 0 980 812" role="img" aria-label="System topology — four tiles on a 2x2 mesh"><defs><marker id="a1b2733" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1b2733"/></marker><marker id="ac2565c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#c2565c"/></marker></defs><rect width="980" height="812" fill="#ffffff"/><text x="24" y="30" font-family="system-ui, sans-serif" font-size="16" font-weight="650" fill="#1b2733">System topology — four tiles on a 2x2 mesh</text><text x="24" y="50" font-family="system-ui, sans-serif" font-size="11.5" fill="#5b6b7c">Every tile is identical: a cache, a directory bank for the quarter of the address space it homes, its own memory, and a router.</text><rect x="60" y="96" width="340" height="232" rx="10" fill="#fbfcfd" stroke="#b9c6d3" stroke-width="1.6"/><text x="74" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" text-anchor="start" fill="#1b2733">Tile 0</text><text x="386" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="end" fill="#5b6b7c">(x=0, y=0)</text><rect x="76" y="130" width="150" height="30" rx="6" fill="#eef1f4" stroke="#8fa0b0" stroke-width="1.4"/><text x="151.0" y="150.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#1b2733">core port</text><rect x="76" y="168" width="150" height="56" rx="6" fill="#fdf2d8" stroke="#d9a441" stroke-width="1.4"/><text x="151.0" y="189.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#1b2733">L1D  4 KB</text><text x="151.0" y="204.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">64 sets x 2 ways</text><text x="151.0" y="217.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">MSHR x4, 13 states</text><rect x="234" y="130" width="150" height="56" rx="6" fill="#fdf2d8" stroke="#d9a441" stroke-width="1.4"/><text x="309.0" y="151.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#1b2733">L2 bank  16 KB</text><text x="309.0" y="166.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">64 sets x 8 ways</text><text x="309.0" y="179.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">directory + TBE x4</text><rect x="234" y="194" width="150" height="30" rx="6" fill="#eef1f4" stroke="#8fa0b0" stroke-width="1.4"/><text x="309.0" y="214.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#1b2733">memory</text><rect x="76" y="234" width="308" height="32" rx="6" fill="#f0e9f6" stroke="#8d6cae" stroke-width="1.4"/><text x="230.0" y="255.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#1b2733">tile_nic</text><text x="230.0" y="264" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">packetise / reassemble, 3 separate vnets</text><rect x="76" y="278" width="308" height="34" rx="6" fill="#e4ecf7" stroke="#5b86c4" stroke-width="1.4"/><text x="230.0" y="300.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#1b2733">router</text><text x="230.0" y="307" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">5 ports x 6 VCs, XY, credit flow control</text><rect x="580" y="96" width="340" height="232" rx="10" fill="#fbfcfd" stroke="#b9c6d3" stroke-width="1.6"/><text x="594" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" text-anchor="start" fill="#1b2733">Tile 1</text><text x="906" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="end" fill="#5b6b7c">(x=1, y=0)</text><rect x="596" y="130" width="150" height="30" rx="6" fill="#eef1f4" stroke="#8fa0b0" stroke-width="1.4"/><text x="671.0" y="150.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#1b2733">core port</text><rect x="596" y="168" width="150" height="56" rx="6" fill="#fdf2d8" stroke="#d9a441" stroke-width="1.4"/><text x="671.0" y="189.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#1b2733">L1D  4 KB</text><text x="671.0" y="204.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">64 sets x 2 ways</text><text x="671.0" y="217.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">MSHR x4, 13 states</text><rect x="754" y="130" width="150" height="56" rx="6" fill="#fdf2d8" stroke="#d9a441" stroke-width="1.4"/><text x="829.0" y="151.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#1b2733">L2 bank  16 KB</text><text x="829.0" y="166.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">64 sets x 8 ways</text><text x="829.0" y="179.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">directory + TBE x4</text><rect x="754" y="194" width="150" height="30" rx="6" fill="#eef1f4" stroke="#8fa0b0" stroke-width="1.4"/><text x="829.0" y="214.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#1b2733">memory</text><rect x="596" y="234" width="308" height="32" rx="6" fill="#f0e9f6" stroke="#8d6cae" stroke-width="1.4"/><text x="750.0" y="255.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#1b2733">tile_nic</text><text x="750.0" y="264" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">packetise / reassemble, 3 separate vnets</text><rect x="596" y="278" width="308" height="34" rx="6" fill="#e4ecf7" stroke="#5b86c4" stroke-width="1.4"/><text x="750.0" y="300.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#1b2733">router</text><text x="750.0" y="307" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">5 ports x 6 VCs, XY, credit flow control</text><rect x="60" y="392" width="340" height="232" rx="10" fill="#fbfcfd" stroke="#b9c6d3" stroke-width="1.6"/><text x="74" y="414" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" text-anchor="start" fill="#1b2733">Tile 2</text><text x="386" y="414" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="end" fill="#5b6b7c">(x=0, y=1)</text><rect x="76" y="426" width="150" height="30" rx="6" fill="#eef1f4" stroke="#8fa0b0" stroke-width="1.4"/><text x="151.0" y="446.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#1b2733">core port</text><rect x="76" y="464" width="150" height="56" rx="6" fill="#fdf2d8" stroke="#d9a441" stroke-width="1.4"/><text x="151.0" y="485.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#1b2733">L1D  4 KB</text><text x="151.0" y="500.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">64 sets x 2 ways</text><text x="151.0" y="513.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">MSHR x4, 13 states</text><rect x="234" y="426" width="150" height="56" rx="6" fill="#fdf2d8" stroke="#d9a441" stroke-width="1.4"/><text x="309.0" y="447.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#1b2733">L2 bank  16 KB</text><text x="309.0" y="462.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">64 sets x 8 ways</text><text x="309.0" y="475.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">directory + TBE x4</text><rect x="234" y="490" width="150" height="30" rx="6" fill="#eef1f4" stroke="#8fa0b0" stroke-width="1.4"/><text x="309.0" y="510.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#1b2733">memory</text><rect x="76" y="530" width="308" height="32" rx="6" fill="#f0e9f6" stroke="#8d6cae" stroke-width="1.4"/><text x="230.0" y="551.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#1b2733">tile_nic</text><text x="230.0" y="560" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">packetise / reassemble, 3 separate vnets</text><rect x="76" y="574" width="308" height="34" rx="6" fill="#e4ecf7" stroke="#5b86c4" stroke-width="1.4"/><text x="230.0" y="596.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#1b2733">router</text><text x="230.0" y="603" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">5 ports x 6 VCs, XY, credit flow control</text><rect x="580" y="392" width="340" height="232" rx="10" fill="#fbfcfd" stroke="#b9c6d3" stroke-width="1.6"/><text x="594" y="414" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" text-anchor="start" fill="#1b2733">Tile 3</text><text x="906" y="414" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="end" fill="#5b6b7c">(x=1, y=1)</text><rect x="596" y="426" width="150" height="30" rx="6" fill="#eef1f4" stroke="#8fa0b0" stroke-width="1.4"/><text x="671.0" y="446.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#1b2733">core port</text><rect x="596" y="464" width="150" height="56" rx="6" fill="#fdf2d8" stroke="#d9a441" stroke-width="1.4"/><text x="671.0" y="485.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#1b2733">L1D  4 KB</text><text x="671.0" y="500.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">64 sets x 2 ways</text><text x="671.0" y="513.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">MSHR x4, 13 states</text><rect x="754" y="426" width="150" height="56" rx="6" fill="#fdf2d8" stroke="#d9a441" stroke-width="1.4"/><text x="829.0" y="447.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#1b2733">L2 bank  16 KB</text><text x="829.0" y="462.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">64 sets x 8 ways</text><text x="829.0" y="475.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">directory + TBE x4</text><rect x="754" y="490" width="150" height="30" rx="6" fill="#eef1f4" stroke="#8fa0b0" stroke-width="1.4"/><text x="829.0" y="510.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#1b2733">memory</text><rect x="596" y="530" width="308" height="32" rx="6" fill="#f0e9f6" stroke="#8d6cae" stroke-width="1.4"/><text x="750.0" y="551.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#1b2733">tile_nic</text><text x="750.0" y="560" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">packetise / reassemble, 3 separate vnets</text><rect x="596" y="574" width="308" height="34" rx="6" fill="#e4ecf7" stroke="#5b86c4" stroke-width="1.4"/><text x="750.0" y="596.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#1b2733">router</text><text x="750.0" y="603" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">5 ports x 6 VCs, XY, credit flow control</text><path d="M 400,295 L 580,295" fill="none" stroke="#1b2733" stroke-width="2.2" marker-end="url(#a1b2733)" marker-start="url(#a1b2733)"/><text x="490.0" y="317.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">E / W   flit + credit</text><path d="M 400,591 L 580,591" fill="none" stroke="#1b2733" stroke-width="2.2" marker-end="url(#a1b2733)" marker-start="url(#a1b2733)"/><text x="490.0" y="613.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#5b6b7c">E / W   flit + credit</text><path d="M 230,328 L 230,392" fill="none" stroke="#1b2733" stroke-width="2.2" marker-end="url(#a1b2733)" marker-start="url(#a1b2733)"/><text x="292.0" y="364.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#5b6b7c">S / N</text><path d="M 750,328 L 750,392" fill="none" stroke="#1b2733" stroke-width="2.2" marker-end="url(#a1b2733)" marker-start="url(#a1b2733)"/><text x="812.0" y="364.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#5b6b7c">S / N</text><path d="M 596,289 L 404,289" fill="none" stroke="#c2565c" stroke-width="3" stroke-dasharray="8 4" marker-end="url(#ac2565c)"/><path d="M 224,328 L 224,388" fill="none" stroke="#c2565c" stroke-width="3" stroke-dasharray="8 4" marker-end="url(#ac2565c)"/><text x="490" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" text-anchor="middle" fill="#c2565c">XY routing</text><text x="490" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#c2565c">X first, then Y</text><text x="490" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#c2565c">tile 1 -&gt; tile 2</text><text x="490" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#c2565c">goes 1 -&gt; 0 -&gt; 2,</text><text x="490" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#c2565c">never 1 -&gt; 3 -&gt; 2</text><text x="490" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#c2565c">(1) X hop</text><text x="490" y="366" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#c2565c">(2) then Y hop</text><text x="490" y="668" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="650" text-anchor="middle" fill="#1b2733">home bank = addr[6:5]</text><text x="490" y="688" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#5b6b7c">consecutive lines interleave across banks, so most requests cross the network</text><rect x="60" y="718" width="20" height="3.5" rx="1.5" fill="#d9a441"/><text x="87" y="725" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1b2733">storage: caches, buffers, queues</text><rect x="60" y="735" width="20" height="3.5" rx="1.5" fill="#5b86c4"/><text x="87" y="742" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1b2733">control: FSMs, tables, allocators</text><rect x="270" y="718" width="20" height="3.5" rx="1.5" fill="#8d6cae"/><text x="297" y="725" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1b2733">interface: packetisation boundary</text><rect x="270" y="735" width="20" height="3.5" rx="1.5" fill="#8fa0b0"/><text x="297" y="742" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1b2733">external: core port, memory model</text><text x="600" y="726" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">Mean hops 1.333 (uniform, no self).  Diameter 2 hops.</text><text x="600" y="740" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">Zero-load latency 8.1 cycles; knee at ~0.60 flits/cycle/node.</text><text x="600" y="754" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">One path per pair, so adaptive routing has nothing to adapt to.</text><text x="600" y="768" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">No X turn ever follows a Y turn, so the channel graph is acyclic.</text></svg>
