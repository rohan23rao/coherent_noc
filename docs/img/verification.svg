<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1000" viewBox="0 0 1240 1000" role="img" aria-label="Verification — six tiers, and what each one cannot do"><defs><marker id="a5b6b7c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5b6b7c"/></marker><marker id="ac2565c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#c2565c"/></marker></defs><rect width="1240" height="1000" fill="#ffffff"/><text x="24" y="30" font-family="system-ui, sans-serif" font-size="16" font-weight="650" fill="#1b2733">Verification — six tiers, and what each one cannot do</text><text x="24" y="50" font-family="system-ui, sans-serif" font-size="11.5" fill="#5b6b7c">Every tier has a column for what it proves and a column for what it cannot. The second column is the one that decided what the next tier had to be.</text><rect x="110" y="100" width="1070" height="86" rx="8" fill="#ffffff" stroke="#5a9e68" stroke-width="1.6"/><rect x="110" y="100" width="8" height="86" rx="3" fill="#5a9e68" stroke="#5a9e68" stroke-width="1.4"/><text x="144" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" text-anchor="middle" fill="#5a9e68">1</text><text x="166" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" text-anchor="start" fill="#5a9e68">Unit</text><text x="166" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">test_unit_*.py</text><text x="410" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" text-anchor="start" fill="#5a9e68">proves</text><text x="410" y="134" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733">each building block does what its header says — including the arbiter's</text><text x="410" y="147" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733">fairness property, measured over 10,000 cycles</text><text x="870" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" text-anchor="start" fill="#c2565c">cannot prove</text><text x="870" y="134" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#5b6b7c">anything about how they are composed</text><rect x="110" y="198" width="1070" height="86" rx="8" fill="#ffffff" stroke="#5a9e68" stroke-width="1.6"/><rect x="110" y="198" width="8" height="86" rx="3" fill="#5a9e68" stroke="#5a9e68" stroke-width="1.4"/><text x="144" y="234" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" text-anchor="middle" fill="#5a9e68">2</text><text x="166" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" text-anchor="start" fill="#5a9e68">Network standalone</text><text x="166" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">test_noc_router / _mesh</text><text x="410" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" text-anchor="start" fill="#5a9e68">proves</text><text x="410" y="232" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733">every packet ejected exactly once, at the right node, flits in order, vnet</text><text x="410" y="245" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733">unchanged; credit and buffer assertions live</text><text x="870" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" text-anchor="start" fill="#c2565c">cannot prove</text><text x="870" y="232" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#5b6b7c">anything about message CONTENT. A network that</text><text x="870" y="245" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#5b6b7c">delivers every packet correctly can still reorder</text><text x="870" y="258" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#5b6b7c">two — bug B19, and this tier passed throughout</text><path d="M 360,186 L 360,198" fill="none" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#a5b6b7c)"/><rect x="110" y="296" width="1070" height="86" rx="8" fill="#ffffff" stroke="#3f7fb5" stroke-width="1.6"/><rect x="110" y="296" width="8" height="86" rx="3" fill="#3f7fb5" stroke="#3f7fb5" stroke-width="1.4"/><text x="144" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" text-anchor="middle" fill="#3f7fb5">3</text><text x="166" y="324" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" text-anchor="start" fill="#3f7fb5">Protocol tables</text><text x="166" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">test_protocol_*_table.py</text><text x="410" y="314" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" text-anchor="start" fill="#5a9e68">proves</text><text x="410" y="330" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733">the RTL tables match an independent Python transcription cell by cell,</text><text x="410" y="343" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733">blanks included — no permissive default anywhere</text><text x="870" y="314" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" text-anchor="start" fill="#c2565c">cannot prove</text><text x="870" y="330" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#5b6b7c">that the table is the RIGHT table. Two</text><text x="870" y="343" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#5b6b7c">transcriptions of the same mistake would agree</text><path d="M 360,284 L 360,296" fill="none" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#a5b6b7c)"/><rect x="110" y="394" width="1070" height="86" rx="8" fill="#ffffff" stroke="#3f7fb5" stroke-width="1.6"/><rect x="110" y="394" width="8" height="86" rx="3" fill="#3f7fb5" stroke="#3f7fb5" stroke-width="1.4"/><text x="144" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" text-anchor="middle" fill="#3f7fb5">4</text><text x="166" y="422" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" text-anchor="start" fill="#3f7fb5">Directed protocol</text><text x="166" y="440" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">test_races.py + 4 more</text><text x="410" y="412" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" text-anchor="start" fill="#5a9e68">proves</text><text x="410" y="428" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733">the twelve named interleavings happen and are handled. Each test asserts a</text><text x="410" y="441" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733">WITNESS — the exact cell it is named after was presented — before it</text><text x="410" y="454" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733">asserts any value</text><text x="870" y="412" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" text-anchor="start" fill="#c2565c">cannot prove</text><text x="870" y="428" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#5b6b7c">that the catalogue is complete. It is a list of the</text><text x="870" y="441" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#5b6b7c">races somebody thought of</text><path d="M 360,382 L 360,394" fill="none" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#a5b6b7c)"/><rect x="110" y="492" width="1070" height="86" rx="8" fill="#ffffff" stroke="#d9a441" stroke-width="1.6"/><rect x="110" y="492" width="8" height="86" rx="3" fill="#d9a441" stroke="#d9a441" stroke-width="1.4"/><text x="144" y="528" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" text-anchor="middle" fill="#d9a441">5</text><text x="166" y="520" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" text-anchor="start" fill="#d9a441">Constrained random</text><text x="166" y="538" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">test_stress.py, 5 configs</text><text x="410" y="510" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" text-anchor="start" fill="#5a9e68">proves</text><text x="410" y="526" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733">100,000 requests per footprint with no assertion failure, no SWMR</text><text x="410" y="539" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733">violation, no value mismatch. Found B16, B19, B20 (x3) and B21</text><text x="870" y="510" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" text-anchor="start" fill="#c2565c">cannot prove</text><text x="870" y="526" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#5b6b7c">absence. The parts of the state space it does not</text><text x="870" y="539" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#5b6b7c">reach are exactly what the coverage report is for</text><path d="M 360,480 L 360,492" fill="none" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#a5b6b7c)"/><rect x="110" y="590" width="1070" height="86" rx="8" fill="#ffffff" stroke="#c2565c" stroke-width="1.6"/><rect x="110" y="590" width="8" height="86" rx="3" fill="#c2565c" stroke="#c2565c" stroke-width="1.4"/><text x="144" y="626" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" text-anchor="middle" fill="#c2565c">6</text><text x="166" y="618" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" text-anchor="start" fill="#c2565c">Mutation</text><text x="166" y="636" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="normal" text-anchor="start" fill="#5b6b7c">make mutate, 15 mutations</text><text x="410" y="608" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" text-anchor="start" fill="#5a9e68">proves</text><text x="410" y="624" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733">the directed tier is sensitive to the arcs it claims to cover. A mutation</text><text x="410" y="637" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1b2733">that survives is an open item, not a pass</text><text x="870" y="608" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" text-anchor="start" fill="#c2565c">cannot prove</text><text x="870" y="624" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#5b6b7c">that the arcs NOT in the table are unnecessary</text><path d="M 360,578 L 360,590" fill="none" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#a5b6b7c)"/><path d="M 110,633.0 L 62,633.0 L 62,437.0 L 110,437.0" fill="none" stroke="#c2565c" stroke-width="2.0" marker-end="url(#ac2565c)"/><g transform="translate(46,535.0) rotate(-90)"><text x="0" y="0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#c2565c">mutation's subject is the tests, not the design</text></g><rect x="110" y="704" width="525" height="232" rx="8" fill="#f7f9fb" stroke="#b9c6d3" stroke-width="1.4"/><text x="134" y="730" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="650" text-anchor="start" fill="#1b2733">Three instruments, each built for one failure</text><text x="134" y="752" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.8" font-weight="normal" text-anchor="start" fill="#5b6b7c">ArcProbe — records every (state, event) PRESENTED to a</text><text x="134" y="766" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.8" font-weight="normal" text-anchor="start" fill="#5b6b7c">controller, not every one accepted. A test that checks only</text><text x="134" y="780" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.8" font-weight="normal" text-anchor="start" fill="#5b6b7c">outcomes cannot tell 'handled correctly' from 'never happened',</text><text x="134" y="794" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.8" font-weight="normal" text-anchor="start" fill="#5b6b7c">and R5 passed for three phases without ever producing the</text><text x="134" y="808" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.8" font-weight="normal" text-anchor="start" fill="#5b6b7c">message in its name (bug B17).</text><text x="134" y="822" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.8" font-weight="normal" text-anchor="start" fill="#5b6b7c"></text><text x="134" y="836" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.8" font-weight="normal" text-anchor="start" fill="#5b6b7c">Hang dump — on a liveness timeout, prints every MSHR, every</text><text x="134" y="850" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.8" font-weight="normal" text-anchor="start" fill="#5b6b7c">TBE and the last 200 messages. Turned a 3000-cycle opaque</text><text x="134" y="864" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.8" font-weight="normal" text-anchor="start" fill="#5b6b7c">stall into a readable sequence.</text><text x="134" y="878" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.8" font-weight="normal" text-anchor="start" fill="#5b6b7c"></text><text x="134" y="892" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.8" font-weight="normal" text-anchor="start" fill="#5b6b7c">LivenessGauge — reports the worst age observed against the</text><text x="134" y="906" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.8" font-weight="normal" text-anchor="start" fill="#5b6b7c">bound, so a passing run says how much margin it had.</text><rect x="655" y="704" width="525" height="232" rx="8" fill="#f7f9fb" stroke="#b9c6d3" stroke-width="1.4"/><text x="679" y="730" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="650" text-anchor="start" fill="#1b2733">Coverage, kept as two lists rather than one number</text><text x="679" y="752" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.8" font-weight="normal" text-anchor="start" fill="#5b6b7c">UNCOVERED AND REACHABLE — must be empty, and is.</text><text x="679" y="766" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.8" font-weight="normal" text-anchor="start" fill="#5b6b7c"></text><text x="679" y="780" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.8" font-weight="normal" text-anchor="start" fill="#5b6b7c">UNCOVERED BY CONSTRUCTION — 26 table cells and one</text><text x="679" y="794" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.8" font-weight="normal" text-anchor="start" fill="#5b6b7c">occupancy bin, each with a written argument for why the</text><text x="679" y="808" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.8" font-weight="normal" text-anchor="start" fill="#5b6b7c">design cannot reach it. Not a waiver list: a waiver says</text><text x="679" y="822" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.8" font-weight="normal" text-anchor="start" fill="#5b6b7c">'ignore this', and each of these says why the cell is</text><text x="679" y="836" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.8" font-weight="normal" text-anchor="start" fill="#5b6b7c">unreachable, which is a claim about the implementation</text><text x="679" y="850" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.8" font-weight="normal" text-anchor="start" fill="#5b6b7c">that can be wrong and can be checked.</text><text x="679" y="864" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.8" font-weight="normal" text-anchor="start" fill="#5b6b7c"></text><text x="679" y="878" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.8" font-weight="normal" text-anchor="start" fill="#5b6b7c">A single coverage percentage would have hidden both lists,</text><text x="679" y="892" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.8" font-weight="normal" text-anchor="start" fill="#5b6b7c">and the second one is where the design's real invariants</text><text x="679" y="906" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.8" font-weight="normal" text-anchor="start" fill="#5b6b7c">are written down.</text></svg>
